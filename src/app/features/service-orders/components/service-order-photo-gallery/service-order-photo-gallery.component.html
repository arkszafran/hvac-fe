<div class="flex gap-2.5 overflow-x-auto pb-1">
  @for (photo of photos(); track photo.id) {
    <a
      [href]="photo.url"
      target="_blank"
      rel="noopener noreferrer"
      class="ui-focus-ring flex h-32 w-50 shrink-0 items-end rounded-button border border-border bg-[repeating-linear-gradient(45deg,_var(--color-surface-muted),_var(--color-surface-muted)_8px,_var(--color-background)_8px,_var(--color-background)_16px)] p-3"
    >
      <span class="max-w-full truncate font-mono text-[0.6875rem]/4 text-text-muted">
        {{ photo.fileName }}
      </span>
    </a>
  }

  <div
    class="flex h-32 w-32 shrink-0 flex-col items-center justify-center gap-2 rounded-button border border-dashed border-text-muted/40 bg-surface text-center text-small text-text-muted"
  >
    <ui-icon class="size-4" name="plus" />
    <span>{{ 'serviceOrders.details.addPhoto' | transloco }}</span>
  </div>
</div>
