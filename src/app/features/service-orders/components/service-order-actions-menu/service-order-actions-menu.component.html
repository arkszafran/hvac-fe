<div [class]="desktopContainerClasses()">
  <ui-menu
    [triggerLabel]="'serviceOrders.actions.openMenu' | transloco"
    [menuLabel]="'serviceOrders.actions.menuLabel' | transloco"
    [triggerClass]="desktopTriggerClasses()"
    panelClass="absolute top-[calc(100%+0.5rem)] z-50 min-w-52 rounded-field border border-border bg-surface p-1.5 shadow-floating"
  >
    @if (context() === 'details') {
      <span menu-trigger>{{ 'serviceOrders.actions.actions' | transloco }}</span>
    } @else {
      <span menu-trigger class="inline-flex size-4">
        <ui-icon name="more" />
      </span>
    }
    @if (canChangeOrder()) {
      <button
        type="button"
        role="menuitem"
        class="ui-focus-ring flex min-h-11 w-full items-center rounded-button px-3 text-left text-small font-medium text-text-main transition-colors hover:bg-action-soft"
        (click)="requestSchedule()"
      >
        {{
          (order().scheduledAt
            ? 'serviceOrders.actions.changeDate'
            : 'serviceOrders.actions.setDate'
          ) | transloco
        }}
      </button>
      <button
        type="button"
        role="menuitem"
        class="ui-focus-ring flex min-h-11 w-full items-center rounded-button px-3 text-left text-small font-medium text-text-main transition-colors hover:bg-action-soft"
        (click)="requestNextContact()"
      >
        {{ 'serviceOrders.actions.setNextContact' | transloco }}
      </button>
    }
    <button
      type="button"
      role="menuitem"
      class="ui-focus-ring flex min-h-11 w-full items-center rounded-button px-3 text-left text-small font-medium text-text-main transition-colors hover:bg-action-soft"
      (click)="requestNote()"
    >
      {{ 'serviceOrders.actions.addNote' | transloco }}
    </button>
    <button
      type="button"
      role="menuitem"
      class="ui-focus-ring flex min-h-11 w-full items-center rounded-button px-3 text-left text-small font-medium text-text-main transition-colors hover:bg-action-soft"
      (click)="requestAssignee()"
    >
      {{ 'serviceOrders.actions.assignAssignee' | transloco }}
    </button>
    @if (canChangeOrder()) {
      <button
        type="button"
        role="menuitem"
        class="ui-focus-ring flex min-h-11 w-full items-center rounded-button px-3 text-left text-small font-medium text-danger transition-colors hover:bg-danger-soft"
        (click)="requestCancellation()"
      >
        {{ 'serviceOrders.actions.customerCancelled' | transloco }}
      </button>
    }
  </ui-menu>
</div>

<div [class]="mobileContainerClasses()">
  <ui-button
    variant="secondary"
    size="lg"
    [iconOnly]="true"
    [ariaLabel]="'serviceOrders.actions.openMenu' | transloco"
    (pressed)="$event.stopPropagation(); isMobileMenuOpen.set(true)"
  >
    <ui-icon button-icon name="more" />
    {{ 'serviceOrders.actions.actions' | transloco }}
  </ui-button>
</div>

<ui-modal
  [open]="isMobileMenuOpen()"
  [title]="'serviceOrders.actions.menuLabel' | transloco"
  (close)="closeMobileMenu()"
>
  <div class="space-y-2">
    @if (canChangeOrder()) {
      <button
        type="button"
        class="ui-focus-ring flex min-h-12 w-full items-center rounded-button bg-surface-muted px-4 text-left text-label text-text-main"
        (click)="requestSchedule()"
      >
        {{
          (order().scheduledAt
            ? 'serviceOrders.actions.changeDate'
            : 'serviceOrders.actions.setDate'
          ) | transloco
        }}
      </button>
      <button
        type="button"
        class="ui-focus-ring flex min-h-12 w-full items-center rounded-button bg-surface-muted px-4 text-left text-label text-text-main"
        (click)="requestNextContact()"
      >
        {{ 'serviceOrders.actions.setNextContact' | transloco }}
      </button>
    }
    <button
      type="button"
      class="ui-focus-ring flex min-h-12 w-full items-center rounded-button bg-surface-muted px-4 text-left text-label text-text-main"
      (click)="requestNote()"
    >
      {{ 'serviceOrders.actions.addNote' | transloco }}
    </button>
    <button
      type="button"
      class="ui-focus-ring flex min-h-12 w-full items-center rounded-button bg-surface-muted px-4 text-left text-label text-text-main"
      (click)="requestAssignee()"
    >
      {{ 'serviceOrders.actions.assignAssignee' | transloco }}
    </button>
    @if (canChangeOrder()) {
      <button
        type="button"
        class="ui-focus-ring flex min-h-12 w-full items-center rounded-button bg-danger-soft px-4 text-left text-label text-danger"
        (click)="requestCancellation()"
      >
        {{ 'serviceOrders.actions.customerCancelled' | transloco }}
      </button>
    }
  </div>
</ui-modal>
