<div>
  <section class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <h1 class="text-display tracking-[-0.04em] text-text-main">{{ 'requests.title' | transloco }}</h1>
      <p class="mt-1 max-w-3xl text-body text-text-muted">
        {{ 'requests.description' | transloco }}
      </p>
    </div>

    <div class="flex flex-wrap gap-2">
      <ui-badge variant="info">{{ statusCountLabel('new') }}</ui-badge>
      <ui-badge variant="warning">{{ statusCountLabel('scheduled') }}</ui-badge>
    </div>
  </section>

  <ui-card padding="sm">
    <div class="grid gap-3 lg:grid-cols-[minmax(0,1fr)_minmax(13rem,16rem)] lg:items-end">
      <ui-input
        type="search"
        [label]="'requests.fields.search' | transloco"
        [placeholder]="'requests.fields.searchPlaceholder' | transloco"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
      />

      <ui-select
        [label]="'requests.fields.status' | transloco"
        placeholder=""
        [options]="statusFilterOptions()"
        [ngModel]="statusFilter()"
        (ngModelChange)="setStatusFilter($event)"
      />
    </div>
  </ui-card>

  <div class="mt-5">
    <app-service-request-table
      [requests]="filteredRequests()"
      [showStatusBadge]="statusFilter() === 'all'"
      (requestSelected)="openDetails($event)"
      (appointmentConfirmationRequested)="openScheduleModal($event)"
      (cancellationRequested)="cancelRequest($event)"
      (visitCreationRequested)="createVisit($event)"
    />
  </div>

  <app-service-request-details-modal
    [open]="!!selectedRequest()"
    [request]="selectedRequest()"
    (close)="selectedRequestId.set(null)"
  />

  <app-service-request-schedule-modal
    [open]="!!scheduledRequest()"
    [initialDate]="scheduledRequest()?.appointmentDate ?? ''"
    (close)="scheduledRequestId.set(null)"
    (save)="confirmAppointment($event)"
  />
</div>
