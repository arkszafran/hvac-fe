<ui-modal
  [open]="open()"
  [title]="'requests.scheduleModal.title' | transloco"
  [description]="'requests.scheduleModal.description' | transloco"
  (close)="handleClose()"
>
  <form [formGroup]="form">
    <ui-input
      [label]="'requests.scheduleModal.appointmentDate' | transloco"
      type="date"
      required
      [error]="validationError()"
      formControlName="appointmentDate"
    />
  </form>

  <div modal-footer class="grid gap-3 sm:grid-cols-2">
    <ui-button type="button" variant="ghost" [block]="true" (pressed)="handleClose()">
      {{ 'common.actions.cancel' | transloco }}
    </ui-button>
    <ui-button type="button" [block]="true" (pressed)="handleSubmit()">
      {{ 'requests.scheduleModal.save' | transloco }}
    </ui-button>
  </div>
</ui-modal>
