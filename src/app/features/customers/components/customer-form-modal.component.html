<ui-modal
  [open]="open()"
  [title]="modalTitle() || ('customers.form.defaultModalTitle' | transloco)"
  [description]="modalDescription()"
  (close)="handleClose()"
>
  <form class="ui-form-stack" [formGroup]="form">
    <div class="space-y-3">
      <p class="text-[13px]/5 font-semibold tracking-[-0.01em] text-text-main">
        {{ 'customers.form.type' | transloco }}
      </p>

      <div class="grid gap-3 sm:grid-cols-2">
        @for (option of customerTypeOptions(); track option.value) {
          <label
            class="flex min-h-11 cursor-pointer items-center gap-3 rounded-[1.05rem] border border-border/90 bg-white px-4 py-3 transition hover:border-primary/28 hover:bg-primary-soft/24"
          >
            <input
              type="radio"
              name="type"
              [value]="option.value"
              formControlName="type"
              class="size-4 shrink-0 accent-[var(--color-primary)]"
            />

            <span class="min-w-0 text-label text-text-main">{{ option.label }}</span>
          </label>
        }
      </div>
    </div>

    @if (form.controls.type.value === 'company') {
      <ui-input
        [label]="'customers.form.company' | transloco"
        [placeholder]="'customers.form.companyPlaceholder' | transloco"
        formControlName="companyName"
      />
    }

    <ui-input
      [label]="'customers.form.fullName' | transloco"
      [placeholder]="'customers.form.fullNamePlaceholder' | transloco"
      formControlName="fullName"
    />

    <ui-input
      [label]="'customers.form.phone' | transloco"
      required
      type="tel"
      placeholder="+48 500 000 000"
      [error]="validationError('phone')"
      formControlName="phone"
    />

    <ui-input
      [label]="'customers.form.email' | transloco"
      required
      type="email"
      placeholder="anna@firma.pl"
      [error]="validationError('email')"
      formControlName="email"
    />

    <ui-input
      [label]="'customers.form.address' | transloco"
      required
      [placeholder]="'customers.form.addressPlaceholder' | transloco"
      [error]="validationError('address')"
      formControlName="address"
    />

    <div class="grid gap-4 sm:grid-cols-2">
      <ui-input
        [label]="'customers.form.postalCode' | transloco"
        required
        placeholder="00-000"
        [error]="validationError('postalCode')"
        formControlName="postalCode"
      />

      <ui-input
        [label]="'customers.form.city' | transloco"
        required
        [placeholder]="'customers.form.cityPlaceholder' | transloco"
        [error]="validationError('city')"
        formControlName="city"
      />
    </div>
  </form>

  <div modal-footer class="grid grid-cols-2 gap-3 sm:flex sm:justify-end">
    <ui-button type="button" variant="ghost" [block]="true" (pressed)="handleClose()">
      {{ 'common.actions.cancel' | transloco }}
    </ui-button>
    <ui-button type="button" [block]="true" (pressed)="handleSubmit()">
      {{ submitLabel() || ('customers.form.defaultSubmitLabel' | transloco) }}
    </ui-button>
  </div>
</ui-modal>
