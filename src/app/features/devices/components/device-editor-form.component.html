<form class="ui-form-stack" [formGroup]="form">
  <ui-select
    [label]="'devices.form.type' | transloco"
    [placeholder]="'devices.form.typePlaceholder' | transloco"
    [options]="deviceTypeOptions()"
    required
    [error]="validationError('type')"
    formControlName="type"
  />

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-select
      [label]="'devices.form.brand' | transloco"
      [placeholder]="'devices.form.brandPlaceholder' | transloco"
      required
      [options]="deviceBrandOptions"
      [error]="validationError('brand')"
      formControlName="brand"
    />

    <ui-input
      [label]="'devices.form.model' | transloco"
      required
      [placeholder]="'devices.form.modelPlaceholder' | transloco"
      [error]="validationError('model')"
      formControlName="model"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-input
      [label]="'devices.form.serialNumber' | transloco"
      [placeholder]="'devices.form.serialNumberPlaceholder' | transloco"
      formControlName="serialNumber"
    />

    <ui-input
      [label]="'devices.form.powerKw' | transloco"
      [placeholder]="'devices.form.powerKwPlaceholder' | transloco"
      type="number"
      [error]="validationError('powerKw')"
      formControlName="powerKw"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-input
      [label]="'devices.form.refrigerant' | transloco"
      [placeholder]="'devices.form.refrigerantPlaceholder' | transloco"
      formControlName="refrigerant"
    />

    <ui-input
      [label]="'devices.form.refrigerantAmount' | transloco"
      [placeholder]="'devices.form.refrigerantAmountPlaceholder' | transloco"
      formControlName="refrigerantAmount"
    />
  </div>

  <div class="pt-2">
    <ui-input
      [label]="'devices.form.location' | transloco"
      [placeholder]="'devices.form.locationPlaceholder' | transloco"
      formControlName="location"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <ui-input
      [label]="'devices.form.installationDate' | transloco"
      type="date"
      [required]="requiresInstallationDate()"
      [error]="validationError('installationDate')"
      formControlName="installationDate"
    />

    <ui-select
      [label]="'devices.form.warranty' | transloco"
      [options]="deviceWarrantyMonthOptions()"
      formControlName="warrantyMonths"
    />
  </div>

  <div class="space-y-2.5">
    <label
      class="flex min-h-11 cursor-pointer items-start gap-3 rounded-field border border-border bg-surface px-4 py-3 transition-colors duration-200 hover:border-action/45 hover:bg-action-soft motion-reduce:transition-none"
    >
      <input
        type="checkbox"
        formControlName="hasScheduledInspections"
        class="mt-1 size-4 shrink-0 rounded border-border accent-[var(--color-primary)]"
      />

      <span class="min-w-0">
        <span class="block text-label text-text-main">{{
          inspectionCheckboxLabelKey | transloco
        }}</span>
        <span class="block text-small text-text-muted">{{
          inspectionCheckboxDescriptionKey | transloco
        }}</span>
      </span>
    </label>
  </div>

  @if (hasScheduledInspections()) {
    <div class="grid gap-4 sm:grid-cols-2">
      <ui-select
        [label]="'devices.form.nextInspectionPreset' | transloco"
        [options]="inspectionPresetOptions()"
        formControlName="nextInspectionPreset"
      />

      <ui-input
        [label]="'devices.form.nextInspectionDate' | transloco"
        type="date"
        required
        [error]="validationError('nextInspectionDate')"
        formControlName="nextInspectionDate"
      />
    </div>
  }

  <div class="space-y-2.5">
    <label
      class="flex min-h-11 cursor-pointer items-start gap-3 rounded-field border border-border bg-surface px-4 py-3 transition-colors duration-200 hover:border-action/45 hover:bg-action-soft motion-reduce:transition-none"
    >
      <input
        type="checkbox"
        formControlName="hasCustomInstallationAddress"
        class="mt-1 size-4 shrink-0 rounded border-border accent-[var(--color-primary)]"
      />

      <span class="min-w-0">
        <span class="block text-label text-text-main">
          {{ 'devices.form.customAddressLabel' | transloco }}
        </span>
      </span>
    </label>
  </div>

  @if (hasCustomInstallationAddress()) {
    <ui-input
      [label]="'devices.form.installationAddress' | transloco"
      [placeholder]="'devices.form.installationAddressPlaceholder' | transloco"
      formControlName="address"
    />

    <div class="grid gap-4 sm:grid-cols-2">
      <ui-input
        [label]="'customers.form.postalCode' | transloco"
        placeholder="00-000"
        formControlName="postalCode"
      />

      <ui-input
        [label]="'customers.form.city' | transloco"
        [placeholder]="'customers.form.cityPlaceholder' | transloco"
        formControlName="city"
      />
    </div>
  }

  <div class="space-y-2.5">
    <label for="device-note" class="flex items-center gap-1 text-label text-text-muted">
      <span>{{ 'devices.form.note' | transloco }}</span>
    </label>

    <textarea
      id="device-note"
      formControlName="note"
      [placeholder]="'devices.form.notePlaceholder' | transloco"
      [class]="textareaClasses"
    ></textarea>
  </div>
</form>
