<div class="-mx-2 space-y-3 md:mx-0 md:space-y-4">
  <header class="flex flex-col gap-4 px-2 md:flex-row md:items-end md:justify-between md:px-0">
    <div class="min-w-0">
      <h1 class="text-h1 text-text-main">
        {{ 'devices.title' | transloco }}
      </h1>
      <p class="mt-1 text-body text-text-muted">
        {{ 'devices.description' | transloco }}
      </p>
    </div>

    <ui-button class="shrink-0 self-start md:self-auto" (pressed)="navigateToCreateDevice()">
      <ui-icon button-icon name="plus" />
      {{ 'devices.actions.add' | transloco }}
    </ui-button>
  </header>

  <section
    class="relative z-20 rounded-card border border-border bg-surface p-2.5"
    [attr.aria-label]="'devices.searchLabel' | transloco"
  >
    <app-device-toolbar [searchControl]="searchControl" />
  </section>

  @if (hasError()) {
    <ui-empty-state
      [title]="'devices.errors.loadListTitle' | transloco"
      [description]="'devices.errors.loadListDescription' | transloco"
      [actionLabel]="'common.actions.retry' | transloco"
      (action)="retryLoad()"
    />
  } @else if (hasLoaded()) {
    <app-device-table
      [devices]="devices()"
      (devicePreviewRequested)="handleDevicePreview($event)"
      (customerPreviewRequested)="selectedCustomer.set($event)"
    />

    @if (pagination(); as pagination) {
      @if (pagination.totalPages > 0) {
        <ui-pagination
          [page]="pagination.page"
          [totalPages]="pagination.totalPages"
          (pageChange)="handlePageChange($event)"
        />
      }
    }
  }

  <app-device-customer-modal
    [open]="selectedCustomer() !== null"
    [customer]="selectedCustomer()"
    (close)="selectedCustomer.set(null)"
  />
</div>
