<ui-modal
  [open]="open()"
  title="Wybierz urządzenia"
  description="Możesz zaznaczyć więcej niż jedno urządzenie klienta."
  (close)="close.emit()"
>
  <div class="space-y-4">
    <ui-input
      type="search"
      label="Szukaj"
      placeholder="Marka, model, numer seryjny, adres"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
    />

    @if (filteredDevices().length) {
      <div class="space-y-2">
        @for (device of filteredDevices(); track device.id) {
          <label
            class="flex cursor-pointer items-start gap-3 rounded-[1rem] border border-border/85 bg-white px-4 py-3 transition hover:border-primary/24 hover:bg-primary-soft/20"
          >
            <input
              type="checkbox"
              class="mt-1 size-4 shrink-0 rounded border-border accent-[var(--color-primary)]"
              [checked]="workingSelection().includes(device.id)"
              (change)="toggleDevice(device.id)"
            />

            <span class="min-w-0">
              <span class="block text-label text-text-main">{{ deviceName(device) }}</span>
              <span class="block text-small text-text-muted">{{ deviceAddress(device) }}</span>
            </span>
          </label>
        }
      </div>
    } @else {
      <div class="rounded-[1rem] border border-dashed border-border/90 bg-white/76 px-4 py-5 text-body text-text-muted">
        Brak urządzeń dla wybranego klienta.
      </div>
    }
  </div>

  <div modal-footer class="grid grid-cols-2 gap-3 sm:flex sm:justify-end">
    <ui-button type="button" variant="ghost" [block]="true" (pressed)="close.emit()">
      Anuluj
    </ui-button>
    <ui-button type="button" [block]="true" (pressed)="saveSelection()">
      Wybierz
    </ui-button>
  </div>
</ui-modal>
