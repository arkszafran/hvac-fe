<ui-modal
  [open]="open()"
  title="Wybierz zaplanowany przegląd"
  description="Pokazujemy przeglądy ze statusem zaplanowany."
  (close)="close.emit()"
>
  <div class="space-y-4">
    <ui-input
      type="search"
      label="Szukaj"
      placeholder="Klient, adres albo urządzenie"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
    />

    @if (filteredInspections().length) {
      <div class="space-y-2">
        @for (details of filteredInspections(); track details.inspection.id) {
          <button
            type="button"
            class="ui-focus-ring block w-full rounded-[1rem] border border-border/85 bg-white px-4 py-3 text-left transition hover:border-primary/24 hover:bg-primary-soft/20"
            (click)="inspectionSelected.emit(details)"
          >
            <span class="block text-label text-text-main">{{ customerName(details) }}</span>
            <span class="block text-small text-text-muted">
              {{ formatInspectionDate(details.inspection.plannedDate || details.inspection.targetDate) }}
            </span>
            <span class="block text-small text-text-muted">{{ devicesLabel(details) }}</span>
          </button>
        }
      </div>
    } @else {
      <div class="rounded-[1rem] border border-dashed border-border/90 bg-white/76 px-4 py-5 text-body text-text-muted">
        Brak zaplanowanych przeglądów do wyboru.
      </div>
    }
  </div>
</ui-modal>
