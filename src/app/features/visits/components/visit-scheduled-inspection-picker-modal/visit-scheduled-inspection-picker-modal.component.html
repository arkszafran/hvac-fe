<ui-modal
  [open]="open()"
  [title]="'visits.scheduledInspectionPicker.title' | transloco"
  [description]="'visits.scheduledInspectionPicker.description' | transloco"
  (close)="close.emit()"
>
  <div class="space-y-4">
    <ui-input
      type="search"
      [formControl]="searchControl"
      [label]="'visits.fields.search' | transloco"
      [placeholder]="'visits.scheduledInspectionPicker.searchPlaceholder' | transloco"
    />

    @if (hasError()) {
      <ui-empty-state
        [title]="'serviceOrders.errors.loadListTitle' | transloco"
        [description]="'serviceOrders.errors.loadListDescription' | transloco"
        [actionLabel]="'common.actions.retry' | transloco"
        (action)="retryLoad()"
      />
    } @else if (hasLoaded()) {
      @if (inspections().length) {
        <div class="space-y-2">
          @for (details of inspections(); track details.order.id) {
            <button
              type="button"
              class="ui-focus-ring block min-h-11 w-full rounded-[1rem] border border-border/85 bg-white px-4 py-3 text-left transition hover:border-primary/24 hover:bg-primary-soft/20 active:bg-primary-soft/30 motion-reduce:transition-none"
              (click)="inspectionSelected.emit(details)"
            >
              <span class="block text-label text-text-main">{{ customerName(details) }}</span>
              <span class="block text-small text-text-muted">
                {{
                  details.order.scheduledAt
                    ? formatInspectionDate(details.order.scheduledAt)
                    : ('serviceOrders.fields.noDate' | transloco)
                }}
              </span>
              <span class="block text-small text-text-muted">{{ devicesLabel(details) }}</span>
            </button>
          }
        </div>

        @if (pagination(); as pagination) {
          @if (pagination.totalPages > 0) {
            <ui-pagination
              [page]="pagination.page"
              [totalPages]="pagination.totalPages"
              (pageChange)="handlePageChange($event)"
            />
          }
        }
      } @else {
        <div
          class="rounded-[1rem] border border-dashed border-border/90 bg-white/76 px-4 py-5 text-body text-text-muted"
        >
          {{ 'visits.scheduledInspectionPicker.empty' | transloco }}
        </div>
      }
    }
  </div>
</ui-modal>
