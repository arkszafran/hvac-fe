<main
  class="ui-page grid min-h-screen place-items-center px-4 py-8 sm:px-6 lg:px-8"
  aria-labelledby="pin-login-title"
>
  <section class="w-full max-w-sm">
    <div class="mb-7 text-center">
      <div
        class="mx-auto mb-4 grid size-14 place-items-center rounded-[1.1rem] border border-primary/18 bg-primary-soft text-h3 font-semibold text-primary-strong shadow-card"
        aria-hidden="true"
      >
        HV
      </div>

      <h1 id="pin-login-title" class="text-h1 text-text-main">{{ 'auth.pinLogin.title' | transloco }}</h1>
    </div>

    <div
      class="ui-panel grid gap-6 p-5 sm:p-6"
      [attr.aria-busy]="isSubmitting() ? 'true' : 'false'"
    >
      @if (serverError()) {
        <p
          id="pin-login-error"
          class="rounded-[0.95rem] border border-danger/25 bg-danger-soft px-4 py-3 text-label font-medium text-danger"
          role="alert"
          aria-live="assertive"
        >
          {{ serverError() }}
        </p>
      }

      @if (isSubmitting()) {
        <div
          class="inline-flex min-h-6 items-center justify-center gap-2 text-label font-medium text-primary-strong"
          role="status"
          aria-live="polite"
        >
          <span
            class="size-4 animate-spin rounded-full border-2 border-primary/30 border-t-primary"
            aria-hidden="true"
          ></span>
          {{ 'auth.pinLogin.checking' | transloco }}
        </div>
      }

      <app-pin-code-input
        [value]="pin()"
        [disabled]="isSubmitting()"
        [ariaLabel]="'auth.pinLogin.keyboard' | transloco"
        (pinChange)="updatePin($event)"
        (pinComplete)="submitPin($event)"
      />
    </div>
  </section>
</main>
