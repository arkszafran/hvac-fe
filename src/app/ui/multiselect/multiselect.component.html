<div class="space-y-1.5">
  @if (label()) {
    <label [attr.for]="inputId()" class="flex items-center gap-1 text-label text-text-muted">
      {{ label() }}
    </label>
  }

  <div class="relative">
    <button
      #triggerButton
      type="button"
      [id]="inputId()"
      [disabled]="isDisabled()"
      [class]="triggerClasses()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? panelId() : null"
      [attr.aria-invalid]="error() ? 'true' : 'false'"
      [attr.aria-describedby]="describedBy() || null"
      (click)="toggleDropdown()"
    >
      <span class="flex min-w-0 flex-1 items-center gap-1">
        @if (inlineLabel()) {
          <span class="shrink-0 text-text-muted">{{ inlineLabel() }}:</span>
        }
        <span class="min-w-0 truncate" [class.text-text-muted]="!selectedValues().length">
          {{ selectionText() }}
        </span>
      </span>

      <svg
        viewBox="0 0 20 20"
        fill="none"
        class="size-4 shrink-0 text-text-muted transition-transform duration-200 motion-reduce:transition-none"
        [class.rotate-180]="isOpen()"
        aria-hidden="true"
      >
        <path
          d="M5 7.5L10 12.5L15 7.5"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    @if (isOpen()) {
      <div
        [id]="panelId()"
        role="group"
        [attr.aria-label]="label() || inlineLabel() || placeholder()"
        class="absolute left-0 top-[calc(100%+0.4375rem)] z-50 max-h-72 w-full overflow-y-auto overscroll-contain rounded-field border border-border bg-surface p-1.5 shadow-floating motion-safe:animate-[ui-fade-in_120ms_ease-out]"
      >
        @for (option of options(); track option.value) {
          <label
            class="flex min-h-11 cursor-pointer items-center gap-3 rounded-button px-3 py-2 text-body text-text-main transition-colors duration-150 hover:bg-action-soft active:bg-action-soft motion-reduce:transition-none"
            [class.cursor-not-allowed]="option.disabled"
            [class.text-text-muted]="option.disabled"
          >
            <input
              type="checkbox"
              class="ui-focus-ring size-4 shrink-0 rounded border-border accent-[var(--color-action-contrast)] disabled:opacity-50"
              [checked]="isSelected(option.value)"
              [disabled]="option.disabled"
              (change)="toggleOption(option.value)"
            />
            <span class="min-w-0 flex-1 [overflow-wrap:anywhere]">{{ option.label }}</span>
          </label>
        }
      </div>
    }
  </div>

  @if (error()) {
    <p [id]="inputId() + '-error'" class="text-[13px]/5 font-medium text-danger">
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p [id]="inputId() + '-hint'" class="text-[13px]/5 text-text-muted">
      {{ hint() }}
    </p>
  }
</div>
