<button
  #triggerButton
  type="button"
  [class]="triggerClass()"
  [attr.aria-label]="triggerLabel()"
  aria-haspopup="menu"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="isOpen() ? menuId : null"
  (click)="toggle($event)"
>
  <ng-content select="[menu-trigger]" />
</button>

@if (isOpen()) {
  <div
    #menuPanel
    [id]="menuId"
    role="menu"
    [attr.aria-label]="menuLabel() ?? triggerLabel()"
    [class]="menuPanelClasses()"
    [style.top]="isOpeningUpward() ? 'auto' : null"
    [style.bottom]="isOpeningUpward() ? 'calc(100% + 0.5rem)' : null"
    (click)="handleMenuClick()"
  >
    <ng-content />
  </div>
}
