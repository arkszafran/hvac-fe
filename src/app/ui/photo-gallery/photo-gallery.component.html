<div class="flex gap-3 overflow-x-auto pb-1">
  @for (photo of photos(); track photo.id) {
    <button
      type="button"
      class="ui-focus-ring group relative block shrink-0 overflow-hidden rounded-button border border-border bg-surface-muted"
      [class.h-24]="compact()"
      [class.w-32]="compact()"
      [class.h-36]="!compact()"
      [class.w-52]="!compact()"
      [attr.aria-label]="'ui.photoCapture.openPreview' | transloco: { name: photo.fileName }"
      (click)="selectedPhoto.set(photo)"
    >
      <img
        class="size-full object-cover transition-transform duration-200 group-hover:scale-[1.03] motion-reduce:transition-none"
        [src]="photo.url"
        [alt]="photo.fileName"
        loading="lazy"
      />
      <span
        class="absolute inset-x-0 bottom-0 truncate bg-slate-950/65 px-3 py-2 text-[0.6875rem]/4 text-white"
      >
        {{ photo.fileName }}
      </span>
    </button>
  }
</div>

@if (selectedPhoto(); as photo) {
  <ui-modal
    size="fullscreen"
    [open]="true"
    [title]="photo.fileName"
    (close)="selectedPhoto.set(null)"
  >
    <div class="flex size-full min-h-0 items-center justify-center overflow-hidden bg-slate-950">
      <img class="max-h-full max-w-full object-contain" [src]="photo.url" [alt]="photo.fileName" />
    </div>

    <div modal-footer>
      <ui-button size="lg" [block]="true" (pressed)="selectedPhoto.set(null)">
        {{ 'common.actions.close' | transloco }}
      </ui-button>
    </div>
  </ui-modal>
}
